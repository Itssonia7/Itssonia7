name: Update Profile Statistics

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "profile/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Itssonia7&show_icons=true&include_all_commits=true&hide_rank=true&hide_border=true&theme=github_dark&show=all_time_contribs,reviews,prs_merged,prs_merged_percentage,prs_authored,prs_reviewed,issues_authored,issues_commented,discussions_started,discussions_answered
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate language statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Itssonia7&layout=compact&langs_count=8&hide_border=true&theme=github_dark
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg
          git commit -m "Update profile statistics" || exit 0
          git push
